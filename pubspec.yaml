name: navigator_resizable
description: >
  A Flutter widget that resizes the child Navigator to match
  the intrinsic size of the current route's content.
version: 3.2.0-wip
homepage: https://github.com/fujidaiti/navigator_resizable
topics:
  - ui
  - widget
  - navigation

environment:
  sdk: ">=3.11.0 <4.0.0"
  flutter: ">=3.41.0"

dependencies:
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
  pedantic_mono: ^1.29.0
  flutter_lints: ">=5.0.0 <7.0.0"
